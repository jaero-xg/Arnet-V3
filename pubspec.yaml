name: ar_elearning
description: AR Network Learning App

publish_to: "none"

version: 1.1.01+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.2

  # Local notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # UI
  flutter_svg: ^2.0.10
  intl: ^0.19.0

  # For scheduling daily notifications
  flutter_timezone: ^5.1.0

  connectivity_plus: ^6.0.0

  package_info_plus: ^8.1.0
  url_launcher: ^6.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/models/
